apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-node-app-deployment
  labels:
    app: sample-node-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-node-app
  template:
    metadata:
      labels:
        app: sample-node-app
    spec:
      containers:
        - name: sample-node-app
          image: shabaz7323/sample-node-app:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
